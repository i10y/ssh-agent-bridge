name: Go Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.18

      - name: Build for windows/amd64
        run: |
          env GOOS=windows GOARCH=amd64 go build -v -ldflags "-H windowsgui" -o build/ssh-agent-bridge-noconsole-x64.exe .
          env GOOS=windows GOARCH=amd64 go build -v -o build/ssh-agent-bridge-x64.exe .

      - name: Build for windows/arm64
        run: |
          env GOOS=windows GOARCH=arm64 go build -v -ldflags "-H windowsgui" -o build/ssh-agent-bridge-noconsole-arm64.exe .
          env GOOS=windows GOARCH=arm64 go build -v -o build/ssh-agent-bridge-arm64.exe .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name
          name: "ssh-agent-bridge"
          # A file, directory or wildcard pattern that describes what to upload
          path: "build/ssh-agent-bridge*.exe"

      - name: Publish
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "build/ssh-agent-bridge*.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
